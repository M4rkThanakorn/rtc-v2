<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turtle RTC & Damage Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #f0fdf4, #e0f2fe, #f8fafc);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .btn-glow {
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
    }
    .btn-glow:hover {
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.55);
    }
    .pulse-dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

  <!-- Header Section -->
  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 text-white py-3.5 px-5 transition-all">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-900 font-black shadow-lg">
          🐢
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-100 flex items-center gap-1.5">
            Turtle RTC <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded-full font-mono">v9.0</span>
          </h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 pulse-dot"></span>
        <span class="text-xs font-semibold text-slate-300">Auto Scan/Edit</span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-5 space-y-5">

    <!-- MAIN PAGE -->
    <div id="mainPage" class="space-y-5 transition-all">

      <!-- CARD 1: MAIN SCAN & EDIT CARD -->
      <div class="glass-card rounded-3xl p-5 shadow-xl shadow-slate-200/50 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <div class="flex items-center gap-2">
            <i data-lucide="scan-line" class="w-5 h-5 text-emerald-600"></i>
            <h2 class="text-base font-bold text-slate-900">ยิงบาร์โค้ด / ค้นหารายการ</h2>
          </div>
          <input type="date" id="recordDate" class="text-xs font-medium border border-slate-200 rounded-xl px-2.5 py-1.5 bg-slate-50 text-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">ยิงบาร์โค้ด หรือ พิมพ์ค้นหา</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <input type="text" id="barcode" placeholder="ยิงบาร์โค้ดที่นี่เพื่อเพิ่มหรือแก้ไข..." oninput="handleScanOrSearch()" 
                class="w-full text-base font-medium border border-slate-200 rounded-2xl px-4 py-3 bg-white/80 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition-all shadow-inner">
            </div>
            <button onclick="toggleCamera()" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white px-4 py-3 rounded-2xl font-semibold shrink-0 flex items-center gap-2 transition shadow-md">
              <i data-lucide="camera" class="w-5 h-5 text-emerald-400"></i>
              <span class="text-xs">กล้อง</span>
            </button>
          </div>
        </div>

        <div id="reader" class="hidden rounded-2xl overflow-hidden border-2 border-emerald-500 shadow-md"></div>

        <!-- STATE 1: EXISTING ITEM FOUND IN LOGS (EDIT MODE) -->
        <div id="existingEditCard" class="hidden bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-300 rounded-2xl p-4 space-y-3 shadow-sm">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-amber-800 flex items-center gap-1">
              <i data-lucide="edit-3" class="w-4 h-4 text-amber-600"></i> พบรายการที่เคยยิงไว้แล้ว
            </span>
            <span id="existingIndexBadge" class="text-[10px] bg-amber-200/80 text-amber-900 px-2 py-0.5 rounded-full font-mono font-bold"></span>
          </div>
          
          <div>
            <div id="existingName" class="text-base font-bold text-slate-800 leading-tight"></div>
            <div id="existingDetails" class="text-xs text-slate-500 mt-1"></div>
          </div>

          <div class="flex items-center gap-3 pt-1">
            <div class="flex-1">
              <label class="block text-[11px] font-bold text-slate-500 mb-1">แก้ไขจำนวน (ชิ้น)</label>
              <input type="number" id="existingQtyInput" min="1" class="w-full border border-amber-300 rounded-xl p-2 text-center font-bold text-lg bg-white outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div class="flex gap-2 self-end">
              <button onclick="saveEditExisting()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-1">
                <i data-lucide="check" class="w-4 h-4"></i> บันทึกแก้ไข
              </button>
              <button onclick="deleteExistingFromCard()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition shadow-md flex items-center gap-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i> ลบ
              </button>
            </div>
          </div>
        </div>

        <!-- STATE 2: PRODUCT MATCHED IN DB (NEW LOG MODE) -->
        <div id="productCard" class="hidden bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200/80 rounded-2xl p-4 shadow-sm">
          <div class="flex items-center gap-1.5 text-xs text-emerald-700 font-bold uppercase tracking-wider mb-0.5">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> พบรายการสินค้า (ยังไม่เคยยิง)
          </div>
          <span id="prodName" class="text-base font-bold text-slate-800 leading-snug block"></span>
        </div>

        <!-- STATE 3: NEW UNKNOWN PRODUCT -->
        <div id="newProductSection" class="hidden bg-slate-100 border border-slate-300 rounded-2xl p-4 space-y-3">
          <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
            <i data-lucide="alert-circle" class="w-4 h-4 text-slate-500"></i> ไม่พบรหัสนี้ในระบบฐานข้อมูล
          </div>
          <input type="text" id="newProdName" placeholder="พิมพ์ชื่อสินค้าใหม่ที่นี่..." 
            class="w-full border border-slate-300 rounded-xl p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <button onclick="addNewProduct()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold shadow-md transition flex items-center justify-center gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i> ลงทะเบียนและยิงสินค้า
          </button>
        </div>

        <!-- FORM ACTION FOR NEW LOG -->
        <div id="formSection" class="hidden space-y-4 pt-1">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">ประเภทรายการ</label>
              <select id="rtcType" class="w-full border border-slate-200 rounded-xl p-2.5 bg-white font-semibold text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none">
                <option value="RTC 30%">RTC 30%</option>
                <option value="RTC 50%">RTC 50%</option>
                <option value="ทำลาย">ทำลาย (Damage)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">จำนวน (ชิ้น)</label>
              <input type="number" id="qty" value="1" min="1" 
                class="w-full border border-slate-200 rounded-xl p-2.5 text-center font-bold text-slate-800 text-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            </div>
          </div>

          <button onclick="saveData()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 active:scale-98 text-white font-bold py-3.5 rounded-2xl shadow-lg btn-glow transition flex items-center justify-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5"></i>
            <span>บันทึกรายการใหม่</span>
          </button>
        </div>
      </div>

      <!-- CARD 2: RECENT LOGS LIST -->
      <div class="glass-card rounded-3xl p-5 shadow-xl shadow-slate-200/50 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <div class="flex items-center gap-2">
            <i data-lucide="list-checks" class="w-5 h-5 text-emerald-600"></i>
            <h3 class="font-bold text-slate-900 text-base">ประวัติที่ยิงแล้วทั้งหมด</h3>
          </div>
          <span id="logCount" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold">0 รายการ</span>
        </div>

        <button id="btnExport" onclick="exportAndShowSummary()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-98 text-white py-3.5 rounded-2xl font-bold shadow-lg transition flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-4 h-4 text-emerald-400"></i>
          <span>ส่งออก & ดูสรุปรายงาน (คัดลอกด่วน)</span>
        </button>

        <div class="overflow-hidden border border-slate-200/80 rounded-2xl bg-white/50">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-100/80 text-slate-600 font-bold border-b border-slate-200">
              <tr>
                <th class="p-3">สินค้า / ประเภท</th>
                <th class="p-3 text-center w-20">จำนวน</th>
                <th class="p-3 text-center w-12">ลบ</th>
              </tr>
            </thead>
            <tbody id="historyBody" class="divide-y divide-slate-100">
              <tr><td colspan="3" class="p-5 text-center text-slate-400 font-medium">ยังไม่มีรายการบันทึก</td></tr>
            </tbody>
          </table>
        </div>

        <div class="flex justify-end pt-1">
          <button onclick="clearLogs()" class="text-xs text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ล้างประวัติในเครื่อง
          </button>
        </div>
      </div>
    </div>

    <!-- SUMMARY PAGE -->
    <div id="summaryPage" class="hidden space-y-5 transition-all">
      <div class="glass-card rounded-3xl p-5 shadow-xl shadow-slate-200/50 space-y-5">
        <div class="flex justify-between items-start border-b border-slate-100 pb-3">
          <div>
            <div class="flex items-center gap-1.5 text-xs text-emerald-600 font-bold uppercase tracking-wider mb-0.5">
              <i data-lucide="bar-chart-3" class="w-4 h-4"></i> สรุปรายงานยิงสินค้า
            </div>
            <h2 id="summaryDate" class="text-sm font-bold text-slate-800"></h2>
          </div>
          <button onclick="backToMain()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl font-bold transition flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> กลับหน้ายิง
          </button>
        </div>

        <!-- QUICK COPY BUTTONS -->
        <div class="grid grid-cols-2 gap-3">
          <button onclick="copyBarcodes()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-1.5">
            <i data-lucide="copy" class="w-4 h-4"></i> คัดลอกบาร์โค้ด
          </button>
          <button onclick="copyQuantities()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white py-3.5 rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-1.5">
            <i data-lucide="layers" class="w-4 h-4"></i> คัดลอกจำนวน
          </button>
        </div>

        <button onclick="copyAllFormatted()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-98 text-white py-3 rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-2">
          <i data-lucide="message-square" class="w-4 h-4 text-emerald-400"></i> คัดลอกสรุปส่งเข้า LINE
        </button>

        <!-- SUMMARY TABLE -->
        <div class="border border-slate-200/80 rounded-2xl overflow-hidden bg-white/80">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-900 text-white font-bold">
              <tr>
                <th class="p-3">บาร์โค้ด</th>
                <th class="p-3">สินค้า / ประเภท</th>
                <th class="p-3 text-center">จำนวน</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4Vh7NNHkWSUICE8xjFn5bSYaIFAqo-mxNXVxuAxeqQcFRnvGTh_l-_V7AE8lL02fnIA/exec";

    document.getElementById("recordDate").value = new Date().toISOString().split('T')[0];

    let defaultDB = {
      "8859682600563": "เทอร์เทิล ขนมปังไส้กรอกชีส 100g",
      "20001291": "เทอร์เทิล ขนมปังกระเทียมครีมชีส 80g",
      "20001359": "เทอร์เทิล ขนมปังไส้กรอกไก่",
      "20001411": "เทอร์เทิล ฮอตดอก 100g",
      "8859682600518": "เทอร์เทิล ครัวซองต์เนยสด 45g"
    };

    let BAKERY_DB = { ...defaultDB };
    let logs = JSON.parse(localStorage.getItem("rtc_logs") || "[]");
    let currentProdName = "";
    let activeFoundLogId = null;
    let html5QrcodeScanner = null;

    lucide.createIcons();

    async function loadCloudDatabase() {
      if (!SCRIPT_URL.includes("script.google.com")) return;
      try {
        let res = await fetch(SCRIPT_URL);
        let cloudDB = await res.json();
        BAKERY_DB = { ...defaultDB, ...cloudDB };
      } catch (e) {
        console.error("Error loading cloud DB", e);
      }
    }
    loadCloudDatabase();
    renderHistory();

    function handleScanOrSearch() {
      let query = document.getElementById("barcode").value.trim().toLowerCase();
      if (!query) return resetForm();

      // 1. Check if item ALREADY EXISTS in active logs
      let existingLogIndex = logs.findIndex(item => 
        item.barcode.toLowerCase() === query || item.name.toLowerCase().includes(query)
      );

      if (existingLogIndex !== -1) {
        let existingLog = logs[existingLogIndex];
        activeFoundLogId = existingLog.id;

        document.getElementById("existingEditCard").classList.remove("hidden");
        document.getElementById("existingIndexBadge").innerText = `รายการที่ ${logs.length - existingLogIndex} จาก ${logs.length}`;
        document.getElementById("existingName").innerText = existingLog.name;
        document.getElementById("existingDetails").innerText = `บาร์โค้ด: ${existingLog.barcode} | ประเภท: ${existingLog.type}`;
        document.getElementById("existingQtyInput").value = existingLog.qty;

        document.getElementById("productCard").classList.add("hidden");
        document.getElementById("formSection").classList.add("hidden");
        document.getElementById("newProductSection").classList.add("hidden");
        return;
      }

      // 2. If not found in logs, check master BAKERY_DB for new entry
      document.getElementById("existingEditCard").classList.add("hidden");
      activeFoundLogId = null;

      let matchedKey = Object.keys(BAKERY_DB).find(k => k.toLowerCase() === query);

      if (matchedKey) {
        currentProdName = BAKERY_DB[matchedKey];
        document.getElementById("prodName").innerText = currentProdName;
        document.getElementById("productCard").classList.remove("hidden");
        document.getElementById("formSection").classList.remove("hidden");
        document.getElementById("newProductSection").classList.add("hidden");
      } else {
        document.getElementById("productCard").classList.add("hidden");
        document.getElementById("formSection").classList.add("hidden");
        document.getElementById("newProductSection").classList.remove("hidden");
      }
    }

    function saveEditExisting() {
      if (!activeFoundLogId) return;
      let newQty = parseInt(document.getElementById("existingQtyInput").value);
      if (isNaN(newQty) || newQty < 1) return alert("กรุณาระบุจำนวนให้ถูกต้อง");

      let log = logs.find(l => l.id === activeFoundLogId);
      if (log) {
        log.qty = newQty;
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
        resetForm();
      }
    }

    function deleteExistingFromCard() {
      if (!activeFoundLogId) return;
      if (confirm("ต้องการลบรายการนี้ออกจากประวัติใช่หรือไม่?")) {
        logs = logs.filter(l => l.id !== activeFoundLogId);
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
        resetForm();
      }
    }

    function toggleCamera() {
      let readerDiv = document.getElementById("reader");
      if (readerDiv.classList.contains("hidden")) {
        readerDiv.classList.remove("hidden");
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} });
        html5QrcodeScanner.render(onScanSuccess);
      } else {
        stopCamera();
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById("barcode").value = decodedText;
      stopCamera();
      handleScanOrSearch();
    }

    function stopCamera() {
      if(html5QrcodeScanner) { html5QrcodeScanner.clear(); }
      document.getElementById("reader").classList.add("hidden");
    }

    function addNewProduct() {
      let barcode = document.getElementById("barcode").value.trim();
      let name = document.getElementById("newProdName").value.trim();
      if (!barcode || !name) return alert("กรุณากรอกรหัสและชื่อสินค้า");

      BAKERY_DB[barcode] = name;
      currentProdName = name;
      document.getElementById("prodName").innerText = name;
      document.getElementById("newProductSection").classList.add("hidden");
      document.getElementById("productCard").classList.remove("hidden");
      document.getElementById("formSection").classList.remove("hidden");
    }

    function saveData() {
      let barcode = document.getElementById("barcode").value.trim();
      let rtcType = document.getElementById("rtcType").value;
      let qty = parseInt(document.getElementById("qty").value);
      let dateVal = document.getElementById("recordDate").value;

      if (!barcode || !qty || qty < 1) return alert("กรุณาตรวจสอบข้อมูล");

      logs.unshift({
        id: Date.now(),
        date: dateVal,
        time: new Date().toLocaleTimeString("th-TH", { hour: '2-digit', minute: '2-digit' }),
        barcode: barcode,
        name: currentProdName || BAKERY_DB[barcode] || barcode,
        type: rtcType,
        qty: qty
      });

      localStorage.setItem("rtc_logs", JSON.stringify(logs));
      resetForm();
      renderHistory();
    }

    function resetForm() {
      document.getElementById("barcode").value = "";
      document.getElementById("existingEditCard").classList.add("hidden");
      document.getElementById("productCard").classList.add("hidden");
      document.getElementById("formSection").classList.add("hidden");
      document.getElementById("newProductSection").classList.add("hidden");
      document.getElementById("qty").value = "1";
      activeFoundLogId = null;
    }

    function renderHistory() {
      let tbody = document.getElementById("historyBody");
      document.getElementById("logCount").innerText = `${logs.length} รายการ`;

      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-5 text-center text-slate-400 font-medium">ยังไม่มีรายการบันทึก</td></tr>`;
        return;
      }

      let html = "";
      logs.forEach((item) => {
        let typeBadge = item.type === 'ทำลาย' ? 'bg-rose-100 text-rose-700 border-rose-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200';

        html += `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="p-3">
              <div class="font-bold text-slate-800 leading-tight text-xs">${item.name}</div>
              <div class="text-[10px] text-slate-400 mt-0.5 font-mono">${item.date} (${item.time}) | ${item.barcode}</div>
              <span class="inline-block mt-1 text-[9px] px-2 py-0.5 rounded-full font-bold border ${typeBadge}">${item.type}</span>
            </td>
            <td class="p-3 text-center">
              <input type="number" min="1" value="${item.qty}" onchange="updateQty(${item.id}, this.value)" 
                class="w-12 border border-slate-200 rounded-lg p-1 text-center font-bold text-slate-800 focus:ring-1 focus:ring-emerald-500 outline-none bg-white">
            </td>
            <td class="p-3 text-center">
              <button onclick="deleteLog(${item.id})" class="text-rose-400 hover:text-rose-600 p-1 font-bold transition">✕</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      lucide.createIcons();
    }

    function updateQty(id, newQty) {
      let parsed = parseInt(newQty);
      if (isNaN(parsed) || parsed < 1) return;
      let log = logs.find(l => l.id === id);
      if (log) {
        log.qty = parsed;
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
      }
    }

    function deleteLog(id) {
      if(confirm("ลบรายการนี้ใช่หรือไม่?")) {
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
      }
    }

    function clearLogs() {
      if (confirm("ล้างประวัติที่บันทึกไว้ในเครื่องใช่หรือไม่?")) {
        logs = [];
        localStorage.removeItem("rtc_logs");
        renderHistory();
      }
    }

    async function exportAndShowSummary() {
      if (logs.length === 0) return alert("ยังไม่มีรายการบันทึก");

      let btn = document.getElementById("btnExport");
      btn.innerText = "⏳ กำลังบันทึกข้อมูลเข้า Google Sheet...";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveLog", logs: logs })
        });
      } catch (e) {
        console.error("Cloud save failed, showing summary anyway", e);
      } finally {
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4 text-emerald-400"></i><span>ส่งออก & ดูสรุปรายงาน (คัดลอกด่วน)</span>`;
        btn.disabled = false;
        lucide.createIcons();
      }

      renderSummaryPage();
    }

    function renderSummaryPage() {
      document.getElementById("mainPage").classList.add("hidden");
      document.getElementById("summaryPage").classList.remove("hidden");

      document.getElementById("summaryDate").innerText = `ประจำวันที่: ${document.getElementById("recordDate").value}`;

      let tbody = document.getElementById("summaryTableBody");
      let html = "";
      logs.forEach(item => {
        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono text-slate-700 font-bold text-xs">${item.barcode}</td>
            <td class="p-3">
              <div class="font-bold text-slate-800 text-xs">${item.name}</div>
              <div class="text-[10px] text-slate-400">${item.type}</div>
            </td>
            <td class="p-3 text-center font-bold text-slate-900 text-xs">${item.qty}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      lucide.createIcons();
    }

    function backToMain() {
      document.getElementById("summaryPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
    }

    function copyBarcodes() {
      let text = logs.map(item => item.barcode).join("\n");
      navigator.clipboard.writeText(text);
      alert("📋 คัดลอกรายการบาร์โค้ดทั้งหมดเรียบร้อยแล้ว!");
    }

    function copyQuantities() {
      let text = logs.map(item => item.qty).join("\n");
      navigator.clipboard.writeText(text);
      alert("📋 คัดลอกรายการจำนวนทั้งหมดเรียบร้อยแล้ว!");
    }

    function copyAllFormatted() {
      let dateVal = document.getElementById("recordDate").value;
      let text = `📦 สรุปรายการ RTC/ทำลาย (${dateVal})\n------------------------------\n`;
      logs.forEach((item, index) => {
        text += `${index + 1}. [${item.barcode}] ${item.name} (${item.type}) = ${item.qty} ชิ้น\n`;
      });
      navigator.clipboard.writeText(text);
      alert("📝 คัดลอกสรุปรายงานทั้งหมดเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
