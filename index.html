<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Turtle RTC Pro - iOS Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: text;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Sarabun", sans-serif;
      background-color: #000000;
      color: #f2f2f7;
    }
    /* iOS Frosted Glass */
    .ios-glass {
      background: rgba(28, 28, 30, 0.72);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
    }
    .ios-card-inner {
      background: rgba(44, 44, 46, 0.5);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
    }
    .ios-input {
      background-color: rgba(118, 118, 128, 0.22);
      color: #ffffff;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
    }
    .ios-input:focus {
      background-color: rgba(118, 118, 128, 0.32);
      border-color: #30d158;
    }
    /* iOS Buttons Tactile Animation */
    .ios-btn-active:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    /* Pulse Dot iOS style */
    .pulse-green {
      box-shadow: 0 0 12px #30d158;
      animation: ios-pulse 2s infinite;
    }
    @keyframes ios-pulse {
      0% { opacity: 1; transform: scale(0.98); }
      50% { opacity: 0.5; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(0.98); }
    }
    ::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center bg-black selection:bg-emerald-500 selection:text-black">

  <!-- DYNAMIC ISLAND HEADER -->
  <header class="w-full max-w-md sticky top-0 z-50 pt-2 px-4 pb-2 bg-black/70 backdrop-blur-2xl border-b border-white/10">
    <div class="flex items-center justify-between">
      
      <!-- Brand & Status -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center text-black font-black text-sm shadow-lg shadow-emerald-500/20">
          🐢
        </div>
        <div>
          <h1 class="text-xs font-bold tracking-tight text-white flex items-center gap-1.5">
            TURTLE RTC <span class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.2 rounded-full font-mono font-extrabold">Pro v11</span>
          </h1>
          <p class="text-[9px] text-zinc-400 font-medium">iOS Edition • Realtime Scanner</p>
        </div>
      </div>

      <!-- Live Indicator pill -->
      <div class="flex items-center gap-1.5 bg-zinc-900/90 border border-white/10 px-2.5 py-1 rounded-full">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-green"></span>
        <span class="text-[10px] font-bold text-zinc-300 tracking-wider font-mono">READY</span>
      </div>

    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="w-full max-w-md px-3.5 pt-3 space-y-3.5 flex-1">

    <!-- MAIN PAGE -->
    <div id="mainPage" class="space-y-3.5 transition-all">

      <!-- CARD 1: SEARCH & SCAN BAR -->
      <div class="ios-glass rounded-[26px] p-4 shadow-2xl space-y-3">
        
        <div class="flex justify-between items-center border-b border-white/10 pb-2.5">
          <div class="flex items-center gap-2">
            <div class="p-1 rounded-lg bg-emerald-500/15 text-emerald-400">
              <i data-lucide="barcode" class="w-4 h-4"></i>
            </div>
            <span class="text-xs font-bold text-zinc-200 tracking-wide">สแกน / ค้นหารายการ</span>
          </div>
          <input type="date" id="recordDate" class="text-[11px] font-medium bg-zinc-900 border border-white/10 rounded-xl px-2.5 py-1 text-zinc-300 outline-none focus:border-emerald-500">
        </div>

        <!-- SEARCH INPUT & CAMERA -->
        <div class="space-y-1">
          <label class="text-[10px] font-medium text-zinc-400 px-0.5">บาร์โค้ด หรือ พิมพ์ชื่อสินค้า</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <input type="text" id="barcode" placeholder="ยิงบาร์โค้ด หรือ ค้นหาลำดับ..." oninput="handleScanOrSearch()" 
                class="w-full text-xs font-semibold ios-input rounded-2xl px-3.5 py-3 text-white placeholder-zinc-500 outline-none transition shadow-inner">
            </div>
            <button onclick="toggleCamera()" class="bg-gradient-to-tr from-emerald-500 to-teal-400 text-black px-3.5 py-3 rounded-2xl font-bold shrink-0 flex items-center justify-center gap-1.5 transition shadow-lg shadow-emerald-500/20 ios-btn-active">
              <i data-lucide="camera" class="w-4 h-4"></i>
              <span class="text-xs font-extrabold">กล้อง</span>
            </button>
          </div>
        </div>

        <div id="reader" class="hidden rounded-2xl overflow-hidden border border-emerald-500/40 shadow-xl"></div>

        <!-- STATE A: EXISTING LOG FOUND (EDIT MODE) -->
        <div id="existingEditCard" class="hidden bg-gradient-to-br from-amber-950/40 to-orange-950/20 border border-amber-500/30 rounded-2xl p-3 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-amber-400 flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> พบรายการที่เคยยิงไว้แล้ว
            </span>
            <span id="existingIndexBadge" class="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-mono font-bold"></span>
          </div>
          
          <div class="ios-card-inner rounded-xl p-2.5">
            <div id="existingName" class="text-xs font-bold text-zinc-100 leading-snug"></div>
            <div id="existingDetails" class="text-[10px] text-zinc-400 font-mono mt-0.5"></div>
          </div>

          <div class="flex items-center gap-2 pt-0.5">
            <div class="flex-1">
              <input type="number" id="existingQtyInput" min="1" class="w-full border border-amber-500/40 rounded-xl py-1 px-2 text-center font-bold text-sm bg-black text-amber-300 outline-none">
            </div>
            <button onclick="saveEditExisting()" class="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-3 py-1.5 rounded-xl text-xs transition shadow-md ios-btn-active flex items-center gap-1">
              <i data-lucide="check" class="w-3.5 h-3.5"></i> บันทึก
            </button>
            <button onclick="deleteExistingFromCard()" class="bg-rose-500/20 border border-rose-500/30 text-rose-400 font-bold px-2.5 py-1.5 rounded-xl text-xs transition ios-btn-active">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <!-- STATE B: FOUND IN DATABASE -->
        <div id="productCard" class="hidden bg-emerald-950/30 border border-emerald-500/30 rounded-2xl p-3 space-y-0.5">
          <div class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider flex items-center gap-1">
            <i data-lucide="check-circle" class="w-3 h-3"></i> พบสินค้าในระบบ (เตรียมบันทึก)
          </div>
          <span id="prodName" class="text-xs font-bold text-zinc-100 leading-tight block"></span>
        </div>

        <!-- STATE C: UNKNOWN PRODUCT -->
        <div id="newProductSection" class="hidden bg-zinc-900 border border-zinc-700/80 rounded-2xl p-3 space-y-2">
          <div class="text-[10px] font-bold text-amber-400 flex items-center gap-1">
            <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> ไม่พบรหัสนี้ในฐานข้อมูล
          </div>
          <input type="text" id="newProdName" placeholder="พิมพ์ชื่อสินค้าเพื่อบันทึกใหม่..." 
            class="w-full border border-zinc-700 rounded-xl p-2 text-xs bg-black text-zinc-100 outline-none focus:border-emerald-500">
          <button onclick="addNewProduct()" class="w-full bg-zinc-800 text-zinc-200 py-1.5 rounded-xl text-xs font-bold border border-zinc-700 transition flex items-center justify-center gap-1 ios-btn-active">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> ลงทะเบียนและยิงสินค้า
          </button>
        </div>

        <!-- NEW ENTRY FORM -->
        <div id="formSection" class="hidden space-y-2.5 pt-1">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-zinc-400 mb-1">ประเภท</label>
              <select id="rtcType" class="w-full border border-white/10 rounded-xl py-2 px-2.5 bg-zinc-900 text-xs font-bold text-zinc-200 outline-none focus:border-emerald-500">
                <option value="RTC 30%">RTC 30%</option>
                <option value="RTC 50%">RTC 50%</option>
                <option value="ทำลาย">ทำลาย (Damage)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-zinc-400 mb-1">จำนวน (ชิ้น)</label>
              <input type="number" id="qty" value="1" min="1" 
                class="w-full border border-white/10 rounded-xl py-1.5 px-2 text-center font-bold text-zinc-100 text-base bg-zinc-900 outline-none focus:border-emerald-500">
            </div>
          </div>

          <button onclick="saveData()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-400 text-black font-black py-3 rounded-2xl shadow-lg shadow-emerald-500/20 ios-btn-active transition flex items-center justify-center gap-2 text-xs">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>บันทึกต่อท้ายลำดับ</span>
          </button>
        </div>

      </div>

      <!-- CARD 2: RECENT LOGS (SEQUENTIAL LIST) -->
      <div class="ios-glass rounded-[26px] p-4 shadow-2xl space-y-3">
        
        <div class="flex justify-between items-center border-b border-white/10 pb-2.5">
          <div class="flex items-center gap-2">
            <div class="p-1 rounded-lg bg-teal-500/15 text-teal-400">
              <i data-lucide="list-ordered" class="w-4 h-4"></i>
            </div>
            <h3 class="font-bold text-zinc-200 text-xs tracking-wide">ลำดับรายการที่ยิง</h3>
          </div>
          <span id="logCount" class="text-[9px] bg-zinc-800 text-emerald-400 border border-white/10 px-2 py-0.5 rounded-full font-mono font-bold">0 รายการ</span>
        </div>

        <button id="btnExport" onclick="exportAndShowSummary()" class="w-full bg-zinc-900 hover:bg-zinc-800 border border-white/10 active:scale-98 text-zinc-100 py-2.5 rounded-2xl font-bold shadow-md transition flex items-center justify-center gap-2 text-xs ios-btn-active">
          <i data-lucide="send" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>ส่งออก & ดูสรุปรายงาน</span>
        </button>

        <div class="overflow-hidden border border-white/10 rounded-2xl bg-black/40">
          <table class="w-full text-xs text-left">
            <thead class="bg-zinc-900/80 text-zinc-400 font-bold border-b border-white/10 text-[10px]">
              <tr>
                <th class="p-2.5 text-center w-8">#</th>
                <th class="p-2.5">สินค้า / ประเภท</th>
                <th class="p-2.5 text-center w-12">จำนวน</th>
                <th class="p-2.5 text-center w-8">ลบ</th>
              </tr>
            </thead>
            <tbody id="historyBody" class="divide-y divide-white/5">
              <tr><td colspan="4" class="p-5 text-center text-zinc-500 text-xs">ยังไม่มีรายการบันทึก</td></tr>
            </tbody>
          </table>
        </div>

        <div class="flex justify-end pt-0.5">
          <button onclick="clearLogs()" class="text-[10px] text-rose-400/80 hover:text-rose-400 font-semibold flex items-center gap-1 transition">
            <i data-lucide="trash-2" class="w-3 h-3"></i> ล้างประวัติทั้งหมด
          </button>
        </div>

      </div>

    </div>

    <!-- SUMMARY PAGE -->
    <div id="summaryPage" class="hidden space-y-3.5 transition-all">
      <div class="ios-glass rounded-[26px] p-4 shadow-2xl space-y-3.5">
        
        <div class="flex justify-between items-center border-b border-white/10 pb-2.5">
          <div>
            <div class="flex items-center gap-1 text-[9px] text-emerald-400 font-bold uppercase tracking-wider mb-0.5">
              <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> สรุปรายงานยิงสินค้า
            </div>
            <h2 id="summaryDate" class="text-xs font-bold text-zinc-200"></h2>
          </div>
          <button onclick="backToMain()" class="text-xs bg-zinc-800 border border-white/10 text-zinc-300 px-3 py-1.5 rounded-xl font-bold transition flex items-center gap-1 ios-btn-active">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> ย้อนกลับ
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="copyBarcodes()" class="bg-zinc-900 border border-white/10 text-zinc-200 py-2.5 rounded-2xl text-xs font-bold transition flex items-center justify-center gap-1.5 ios-btn-active">
            <i data-lucide="copy" class="w-3.5 h-3.5 text-sky-400"></i> คัดลอกบาร์โค้ด
          </button>
          <button onclick="copyQuantities()" class="bg-zinc-900 border border-white/10 text-zinc-200 py-2.5 rounded-2xl text-xs font-bold transition flex items-center justify-center gap-1.5 ios-btn-active">
            <i data-lucide="layers" class="w-3.5 h-3.5 text-emerald-400"></i> คัดลอกจำนวน
          </button>
        </div>

        <button onclick="copyAllFormatted()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-400 text-black py-3 rounded-2xl text-xs font-black transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-1.5 ios-btn-active">
          <i data-lucide="message-square" class="w-4 h-4"></i> คัดลอกสรุปส่งเข้า LINE
        </button>

        <div class="border border-white/10 rounded-2xl overflow-hidden bg-black/50">
          <table class="w-full text-xs text-left">
            <thead class="bg-zinc-900 text-zinc-400 font-bold border-b border-white/10 text-[10px]">
              <tr>
                <th class="p-2.5 text-center w-8">#</th>
                <th class="p-2.5">บาร์โค้ด</th>
                <th class="p-2.5">สินค้า / ประเภท</th>
                <th class="p-2.5 text-center">จำนวน</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody" class="divide-y divide-white/10"></tbody>
          </table>
        </div>

      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4Vh7NNHkWSUICE8xjFn5bSYaIFAqo-mxNXVxuAxeqQcFRnvGTh_l-_V7AE8lL02fnIA/exec";

    document.getElementById("recordDate").value = new Date().toISOString().split('T')[0];

    let defaultDB = {
      "8859682600563": "เทอร์เทิล ขนมปังไส้กรอกชีส 100g",
      "20001291": "เทอร์เทิล ขนมปังกระเทียมครีมชีส 80g",
      "20001359": "เทอร์เทิล ขนมปังไส้กรอกไก่",
      "20001411": "เทอร์เทิล ฮอตดอก 100g",
      "8859682600518": "เทอร์เทิล ครัวซองต์เนยสด 45g"
    };

    let BAKERY_DB = { ...defaultDB };
    let logs = JSON.parse(localStorage.getItem("rtc_logs") || "[]");
    let currentProdName = "";
    let activeFoundLogId = null;
    let html5QrcodeScanner = null;

    lucide.createIcons();

    async function loadCloudDatabase() {
      if (!SCRIPT_URL.includes("script.google.com")) return;
      try {
        let res = await fetch(SCRIPT_URL);
        let cloudDB = await res.json();
        BAKERY_DB = { ...defaultDB, ...cloudDB };
      } catch (e) {
        console.error("Error loading cloud DB", e);
      }
    }
    loadCloudDatabase();
    renderHistory();

    function handleScanOrSearch() {
      let query = document.getElementById("barcode").value.trim().toLowerCase();
      if (!query) return resetForm();

      // 1. SEARCH IN EXISTING LOGS
      let existingLogIndex = logs.findIndex(item => 
        item.barcode.toLowerCase() === query || item.name.toLowerCase().includes(query)
      );

      if (existingLogIndex !== -1) {
        let existingLog = logs[existingLogIndex];
        activeFoundLogId = existingLog.id;

        document.getElementById("existingEditCard").classList.remove("hidden");
        document.getElementById("existingIndexBadge").innerText = `ลำดับที่ ${existingLogIndex + 1} จาก ${logs.length}`;
        document.getElementById("existingName").innerText = existingLog.name;
        document.getElementById("existingDetails").innerText = `บาร์โค้ด: ${existingLog.barcode} | ประเภท: ${existingLog.type}`;
        document.getElementById("existingQtyInput").value = existingLog.qty;

        document.getElementById("productCard").classList.add("hidden");
        document.getElementById("formSection").classList.add("hidden");
        document.getElementById("newProductSection").classList.add("hidden");
        return;
      }

      // 2. SEARCH IN MASTER DATABASE
      document.getElementById("existingEditCard").classList.add("hidden");
      activeFoundLogId = null;

      let matchedKey = Object.keys(BAKERY_DB).find(k => k.toLowerCase() === query);

      if (matchedKey) {
        currentProdName = BAKERY_DB[matchedKey];
        document.getElementById("prodName").innerText = currentProdName;
        document.getElementById("productCard").classList.remove("hidden");
        document.getElementById("formSection").classList.remove("hidden");
        document.getElementById("newProductSection").classList.add("hidden");
      } else {
        document.getElementById("productCard").classList.add("hidden");
        document.getElementById("formSection").classList.add("hidden");
        document.getElementById("newProductSection").classList.remove("hidden");
      }
    }

    function saveEditExisting() {
      if (!activeFoundLogId) return;
      let newQty = parseInt(document.getElementById("existingQtyInput").value);
      if (isNaN(newQty) || newQty < 1) return alert("กรุณาระบุจำนวนให้ถูกต้อง");

      let log = logs.find(l => l.id === activeFoundLogId);
      if (log) {
        log.qty = newQty;
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
        resetForm();
      }
    }

    function deleteExistingFromCard() {
      if (!activeFoundLogId) return;
      if (confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) {
        logs = logs.filter(l => l.id !== activeFoundLogId);
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
        resetForm();
      }
    }

    function toggleCamera() {
      let readerDiv = document.getElementById("reader");
      if (readerDiv.classList.contains("hidden")) {
        readerDiv.classList.remove("hidden");
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 230, height: 130} });
        html5QrcodeScanner.render(onScanSuccess);
      } else {
        stopCamera();
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById("barcode").value = decodedText;
      stopCamera();
      handleScanOrSearch();
    }

    function stopCamera() {
      if(html5QrcodeScanner) { html5QrcodeScanner.clear(); }
      document.getElementById("reader").classList.add("hidden");
    }

    function addNewProduct() {
      let barcode = document.getElementById("barcode").value.trim();
      let name = document.getElementById("newProdName").value.trim();
      if (!barcode || !name) return alert("กรุณากรอกรหัสและชื่อสินค้า");

      BAKERY_DB[barcode] = name;
      currentProdName = name;
      document.getElementById("prodName").innerText = name;
      document.getElementById("newProductSection").classList.add("hidden");
      document.getElementById("productCard").classList.remove("hidden");
      document.getElementById("formSection").classList.remove("hidden");
    }

    function saveData() {
      let barcode = document.getElementById("barcode").value.trim();
      let rtcType = document.getElementById("rtcType").value;
      let qty = parseInt(document.getElementById("qty").value);
      let dateVal = document.getElementById("recordDate").value;

      if (!barcode || !qty || qty < 1) return alert("กรุณาตรวจสอบข้อมูล");

      // FIFO Sequential append
      logs.push({
        id: Date.now(),
        date: dateVal,
        time: new Date().toLocaleTimeString("th-TH", { hour: '2-digit', minute: '2-digit' }),
        barcode: barcode,
        name: currentProdName || BAKERY_DB[barcode] || barcode,
        type: rtcType,
        qty: qty
      });

      localStorage.setItem("rtc_logs", JSON.stringify(logs));
      resetForm();
      renderHistory();
    }

    function resetForm() {
      document.getElementById("barcode").value = "";
      document.getElementById("existingEditCard").classList.add("hidden");
      document.getElementById("productCard").classList.add("hidden");
      document.getElementById("formSection").classList.add("hidden");
      document.getElementById("newProductSection").classList.add("hidden");
      document.getElementById("qty").value = "1";
      activeFoundLogId = null;
    }

    function renderHistory() {
      let tbody = document.getElementById("historyBody");
      document.getElementById("logCount").innerText = `${logs.length} รายการ`;

      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-5 text-center text-zinc-500 text-xs">ยังไม่มีรายการบันทึก</td></tr>`;
        return;
      }

      let html = "";
      logs.forEach((item, index) => {
        let typeBadge = item.type === 'ทำลาย' 
          ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' 
          : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        html += `
          <tr class="hover:bg-zinc-900/60 transition">
            <td class="p-2.5 text-center font-mono font-bold text-zinc-400 text-[11px]">${index + 1}</td>
            <td class="p-2.5">
              <div class="font-bold text-zinc-100 text-xs leading-snug">${item.name}</div>
              <div class="text-[10px] text-zinc-400 font-mono mt-0.5">${item.barcode}</div>
              <span class="inline-block mt-0.5 text-[8px] px-2 py-0.2 rounded-full font-bold border ${typeBadge}">${item.type}</span>
            </td>
            <td class="p-2.5 text-center">
              <input type="number" min="1" value="${item.qty}" onchange="updateQty(${item.id}, this.value)" 
                class="w-10 border border-white/10 rounded-lg py-0.5 text-center font-bold text-zinc-100 bg-black outline-none focus:border-emerald-500 text-xs">
            </td>
            <td class="p-2.5 text-center">
              <button onclick="deleteLog(${item.id})" class="text-zinc-500 hover:text-rose-400 font-bold transition text-xs p-1">✕</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      lucide.createIcons();
    }

    function updateQty(id, newQty) {
      let parsed = parseInt(newQty);
      if (isNaN(parsed) || parsed < 1) return;
      let log = logs.find(l => l.id === id);
      if (log) {
        log.qty = parsed;
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
      }
    }

    function deleteLog(id) {
      if(confirm("ลบรายการนี้ใช่หรือไม่?")) {
        logs = logs.filter(l => l.id !== id);
        localStorage.setItem("rtc_logs", JSON.stringify(logs));
        renderHistory();
      }
    }

    function clearLogs() {
      if (confirm("ต้องการล้างประวัติที่ยิงทั้งหมดในเครื่องใช่หรือไม่?")) {
        logs = [];
        localStorage.removeItem("rtc_logs");
        renderHistory();
      }
    }

    async function exportAndShowSummary() {
      if (logs.length === 0) return alert("ยังไม่มีรายการบันทึก");

      let btn = document.getElementById("btnExport");
      btn.innerText = "⏳ กำลังส่งข้อมูลไปยัง Google Sheet...";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "saveLog", logs: logs })
        });
      } catch (e) {
        console.error("Cloud save failed, showing summary anyway", e);
      } finally {
        btn.innerHTML = `<i data-lucide="send" class="w-3.5 h-3.5 text-emerald-400"></i><span>ส่งออก & ดูสรุปรายงาน</span>`;
        btn.disabled = false;
        lucide.createIcons();
      }

      renderSummaryPage();
    }

    function renderSummaryPage() {
      document.getElementById("mainPage").classList.add("hidden");
      document.getElementById("summaryPage").classList.remove("hidden");

      document.getElementById("summaryDate").innerText = `ประจำวันที่: ${document.getElementById("recordDate").value}`;

      let tbody = document.getElementById("summaryTableBody");
      let html = "";
      logs.forEach((item, index) => {
        html += `
          <tr class="hover:bg-zinc-900/60 transition">
            <td class="p-2.5 text-center font-mono font-bold text-zinc-400 text-[11px]">${index + 1}</td>
            <td class="p-2.5 font-mono text-zinc-300 font-bold text-xs">${item.barcode}</td>
            <td class="p-2.5">
              <div class="font-bold text-zinc-100 text-xs">${item.name}</div>
              <div class="text-[9px] text-zinc-400">${item.type}</div>
            </td>
            <td class="p-2.5 text-center font-bold text-emerald-400 text-xs">${item.qty}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
      lucide.createIcons();
    }

    function backToMain() {
      document.getElementById("summaryPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
    }

    function copyBarcodes() {
      let text = logs.map(item => item.barcode).join("\n");
      navigator.clipboard.writeText(text);
      alert("📋 คัดลอกรายการบาร์โค้ดตามลำดับเรียบร้อยแล้ว!");
    }

    function copyQuantities() {
      let text = logs.map(item => item.qty).join("\n");
      navigator.clipboard.writeText(text);
      alert("📋 คัดลอกรายการจำนวนตามลำดับเรียบร้อยแล้ว!");
    }

    function copyAllFormatted() {
      let dateVal = document.getElementById("recordDate").value;
      let text = `📦 สรุปรายการ RTC/ทำลาย (${dateVal})\n------------------------------\n`;
      logs.forEach((item, index) => {
        text += `${index + 1}. [${item.barcode}] ${item.name} (${item.type}) = ${item.qty} ชิ้น\n`;
      });
      navigator.clipboard.writeText(text);
      alert("📝 คัดลอกสรุปรายงานทั้งหมดเรียบร้อยแล้ว!");
    }
  </script>
</body>
</html>
